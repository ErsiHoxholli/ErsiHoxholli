name: Generate Contribution Snake
 
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00E5FF&color_dots=#0d1117,#003333,#005555,#00888f,#00E5FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00E5FF&color_dots=#0d1117,#003333,#005555,#00888f,#00E5FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 









